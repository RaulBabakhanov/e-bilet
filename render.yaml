services:
  - type: web
    name: e-bilet-raul-babakhanov
    runtime: node
    plan: free
    buildCommand: npm ci --prefix server --omit=dev && npm ci --prefix client --include=dev && npm run build
    startCommand: npm run seed && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24.18.0
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
